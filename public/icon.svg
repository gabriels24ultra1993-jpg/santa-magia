<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SANTA MAGIA">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="55%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hatRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-bleed deep red background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle outer golden ring inside safe zone -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.88" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="8 10" stroke-opacity="0.55" />

  <!-- Twinkling golden stars inside safe zone -->
  <path d="M138 148 L144 164 L160 170 L144 176 L138 192 L132 176 L116 170 L132 164 Z" fill="#fde68a" />
  <path d="M372 142 L377 155 L390 160 L377 165 L372 178 L367 165 L354 160 L367 155 Z" fill="#fbbf24" />
  <circle cx="152" cy="340" r="5" fill="#fde68a" opacity="0.85" />
  <circle cx="364" cy="336" r="6" fill="#fde68a" opacity="0.85" />

  <!-- Golden Magic North Star Seal -->
  <g filter="url(#softGlow)">
    <!-- Festive Santa Hat tilted slightly on golden emblem -->
    <path d="M168 242 C180 158 246 118 326 146 C348 154 360 178 346 202 C332 192 316 188 300 194 C308 214 316 232 322 246 Z" fill="url(#hatRed)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Santa Hat Pom-Pom -->
    <circle cx="352" cy="188" r="24" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="5" />

    <!-- Santa Hat Fluffy Trim -->
    <rect x="150" y="226" width="194" height="44" rx="22" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Golden Ribbon / Letter Crest below hat -->
    <rect x="166" y="286" width="180" height="102" rx="20" fill="#7f1d1d" stroke="url(#goldGrad)" stroke-width="8" />
    <path d="M174 294 L256 346 L338 294" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wax Seal Gold Star on Envelope -->
    <circle cx="256" cy="344" r="22" fill="url(#goldGrad)" stroke="#450a0a" stroke-width="3" />
    <path d="M256 330 L260 339 L270 340 L262 346 L264 356 L256 351 L248 356 L250 346 L242 340 L252 339 Z" fill="#7f1d1d" />
  </g>
</svg>
